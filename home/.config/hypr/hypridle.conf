general {
    lock_cmd = pidof swaylock || swaylock -f    # Lock screen when idle timeout reached
    before_sleep_cmd = swaylock -f              # Lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # Turn on display after resume
}

# Turn off display after 10 minutes (600 seconds)
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend system after 15 minutes (900 seconds)
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
