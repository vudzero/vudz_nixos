general {
    lock_cmd = pidof hyprlock || hyprlock       # Lock screen when idle timeout reached
    before_sleep_cmd = loginctl lock-session    # Lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # Turn on display after resume
    ignore_dbus_inhibit = false                 # Respect inhibit requests (e.g., from games/media players)
}

# Turn off display after 10 minutes (600 seconds)
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend system after 15 minutes (900 seconds)
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
