general {
    lock_cmd = pidof swaylock || swaylock -f         # Lock screen command (for manual locks)
    before_sleep_cmd = pidof swaylock || swaylock -f # Lock directly before suspend
    after_sleep_cmd = hyprctl dispatch dpms on       # Turn on display after resume
}

# Lock screen after 5 minutes (300 seconds)
listener {
    timeout = 300
    on-timeout = pidof swaylock || swaylock -f
}

# Turn off display after 10 minutes (600 seconds)
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend system after 15 minutes (900 seconds)
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
