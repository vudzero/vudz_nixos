### Monitor Configuration
monitor=,highres,auto,2.5

### Environment Variables
env = HYPRCURSOR_SIZE,32
env = HYPRCURSOR_THEME,rose-pine-hyprcursor
env = WAYLAND_DISPLAY,wayland-1
env = NIXOS_OZONE_WL,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

### Keybindings
source = ~/.config/hypr/keybindings.conf

### Autostart

# Services
exec-once = hyprpaper
exec-once = waybar
exec-once = hypridle
exec-once = mako
exec-once = blueman-applet
exec-once = systemctl --user import-environment XDG_SESSION_TYPE XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland

# Applications
exec-once = ~/.config/hypr/startup-apps.sh

### Workspace Names
# Workspaces are not bound to specific monitors
# Lid switch scripts will dynamically assign to active monitor
workspace = 1, name:term
workspace = 2, name:web
workspace = 3, name:code
workspace = 4, name:chat
workspace = 5, name:media
workspace = 6, name:misc
workspace = 7, name:7
workspace = 8, name:8
workspace = 9, name:9

### Input Configuration
input {
    kb_layout = us
    # This sets the Right Alt key as your Compose Key
    kb_options = compose:ralt,caps:swapescape
    follow_mouse = 1
    sensitivity = 0
}

### Cursor Configuration
cursor {
    no_hardware_cursors = false
    enable_hyprcursor = true
}

### Look and Feel
source = ~/.config/hypr/looknfeel.conf

### Window Rules
# Rofi - remove Hyprland borders/padding
windowrule = border_size 0, match:class Rofi

# Yazi file manager - floating centered window
windowrule = float on, match:class yazi
windowrule = size 1200 800, match:class yazi
windowrule = pin on, match:class yazi

# Impala terminal - floating window
windowrule = float on, match:class impala
windowrule = size 1200 800, match:class impala
windowrule = pin on, match:class impala

# Bluetuith terminal - floating window
windowrule = float on, match:class bluetuith
windowrule = size 1200 800, match:class bluetuith
windowrule = pin on, match:class bluetuith

# Ultra Cinema Player - floating window
windowrule = float on, match:class ultra_cinema
