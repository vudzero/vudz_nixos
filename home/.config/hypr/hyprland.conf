### Monitor Configuration
monitor=,highres,auto,2.5
# This uses any available monitor with preferred resolution and 2.5x scaling

### Environment Variables
env = HYPRCURSOR_SIZE,32
env = HYPRCURSOR_THEME,rose-pine-hyprcursor

### Autostart

# Services
exec-once = hyprpaper
exec-once = waybar
exec-once = hypridle
exec-once = mako
exec-once = blueman-applet
exec-once = systemctl --user import-environment XDG_SESSION_TYPE XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland

# Applications
exec-once = ~/.config/hypr/startup-apps.sh

### Workspace Names
workspace = 1, name:term
workspace = 2, name:web
workspace = 3, name:code
workspace = 4, name:chat
workspace = 5, name:media
workspace = 6, name:misc
workspace = 7, name:7
workspace = 8, name:8
workspace = 9, name:9

### Input Configuration
input {
    kb_layout = us
    # This sets the Right Alt key as your Compose Key
    kb_options = compose:ralt
    follow_mouse = 1
    sensitivity = 0
}

### Cursor Configuration
cursor {
    no_hardware_cursors = false
    enable_hyprcursor = true
}

### Look and Feel
source = ~/.config/hypr/looknfeel.conf

### Window Rules
windowrulev2 = float, class:(org.gnome.Nautilus)
windowrulev2 = size 1200 800, class:(org.gnome.Nautilus)
windowrulev2 = idleinhibit fullscreen, class:.*  # Disable idle detection for fullscreen apps

### Keybindings
$mainMod = SUPER

# Launch terminal
bind = $mainMod, Return, exec, alacritty

# Launch browser
bind = $mainMod, B, exec, google-chrome-stable

# Launch application launcher
bind = $mainMod, Space, exec, rofi -show drun

# Close window
bind = $mainMod, Q, killactive,

# Copy/Paste (universal clipboard shortcuts that work everywhere)
# Uses Ctrl+Insert and Shift+Insert which work in terminals AND GUI apps
# Note: Trailing comma targets active window
bind = $mainMod, C, sendshortcut, CTRL, c,
bind = $mainMod, V, sendshortcut, CTRL, v,

# Reload config
bind = $mainMod SHIFT, R, exec, hyprctl reload

# Exit Hyprland (closes all windows first)
bind = $mainMod SHIFT, Q, exec, ~/.config/hypr/exit-hyprland.sh

# Lock and suspend
bind = $mainMod SHIFT, L, exec, hyprlock & sleep 1 && systemctl suspend

# Toggle hypridle (gaming mode)
bind = $mainMod, G, exec, ~/.config/hypr/toggle-hypridle.sh

# Screenshots
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot copied" "Copied to clipboard"
bind = , Print, exec, grim ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png && notify-send "Screenshot saved" "Saved to ~/Pictures/"
bind = $mainMod SHIFT, E, exec, grim -g "$(slurp)" - | swappy -f -

### Workspace Switching
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move active window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

### Focus & Movement
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

### Volume Controls
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Audio device switcher
bind = $mainMod, A, exec, ~/.config/hypr/audio-switcher.sh

### Media Controls
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

### Mouse bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
