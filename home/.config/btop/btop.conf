# Btop configuration

# Color theme (default, nord, gruvbox_dark, etc.)
color_theme = "Default"

# Use transparent background (inherits terminal background)
theme_background = False

# Enable truecolor
truecolor = True

# Update interval in milliseconds
update_ms = 2000

# Show disks
show_disks = True

# Show temperature
show_temps = False

# CPU graph type (default, braille, block, tty)
cpu_graph_upper = "default"
cpu_graph_lower = "default"

# Memory graph type
mem_graph_upper = "default"
mem_graph_lower = "default"

# Network graph type
net_graph_upper = "default"
net_graph_lower = "default"

# Show CPU usage per core
show_cpu_freq = True

# Rounded corners
rounded_corners = True

# Show battery
show_battery = True

# Process columns (remove "user" to hide User column)
# Available: pid, program, arguments, threads, user, mem, cpu
proc_columns = "pid program mem cpu"
