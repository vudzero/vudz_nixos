# tmux configuration

# Change prefix from Ctrl+b to Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Move the status bar to the top
set-option -g status-position top

# Basic settings
set -g mouse on
set -g history-limit 10000

# Enable 256 colors
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Start window numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Faster key repeat
set -sg escape-time 0

# Vim-style pane navigation (with prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Ctrl+Alt+Arrow key pane navigation (no prefix needed)
bind-key -n C-M-Left select-pane -L
bind-key -n C-M-Right select-pane -R
bind-key -n C-M-Up select-pane -U
bind-key -n C-M-Down select-pane -D

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Reload config with r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Status bar styling
set -g status-style bg=default,fg=white
set -g status-left-length 40
set -g status-left "[#S] "
set -g status-right ""
set -g status-justify left

# Window status
setw -g window-status-current-style bg=blue,fg=black,bold
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
setw -g window-status-style fg=default

# ALT+number to select windows (no prefix needed)
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
bind-key -n M-0 select-window -t 10

# Pane border colors (teal blue)
set -g pane-border-style fg=colour6
set -g pane-active-border-style fg=colour14

# Session persistence with tmux-resurrect
# Save: Ctrl+Space Ctrl+s
# Restore: Ctrl+Space Ctrl+r
# Plugins loaded from /etc/tmux-plugins (symlinks created by NixOS)
run-shell /etc/tmux-plugins/resurrect/resurrect.tmux
run-shell /etc/tmux-plugins/continuum/continuum.tmux

# Continuum settings
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Custom command: Create new session with default pane layout
# Usage: Ctrl+Space + d
# Creates a new session named "dev-<timestamp>" with 3 panes:
# - Left pane: 70% width
# - Top-right: 30% width, 80% height
# - Bottom-right: 30% width, 20% height
bind d run-shell 'session="dev-$(date +%H%M%S)"; tmux new-session -d -s "$session" -c "#{pane_current_path}"; tmux split-window -h -p 30 -t "$session":1; tmux split-window -v -p 80 -t "$session":1.2; tmux select-pane -t "$session":1.1; tmux switch-client -t "$session"'
